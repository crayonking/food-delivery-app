services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: keycloak-food
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-food        # ✅ Must match service name below
      KC_DB_URL_DATABASE: keycloakdb
      KC_DB_USERNAME: keycloakuser
      KC_DB_PASSWORD: keycloakpass     # ✅ Missing in your version
    depends_on:
      - postgres-food                       # ✅ Ensures DB is up before Keycloak starts
    command: start-dev
    volumes:
      - keycloak_data:/opt/keycloak/data**
    networks:
      - food-delivery
      # Add health check to ensure Keycloak is ready
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/realms/food-delivery/.well-known/openid_configuration || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5

  postgres-food:
    image: postgres:latest
    container_name: postgres-food
    restart: always
    environment:
      POSTGRES_USER: keycloakuser
      POSTGRES_PASSWORD: keycloakpass
      POSTGRES_DB: keycloakdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - food-delivery


  user-service:
    build:
      context: ./backend/UserService
    container_name: user-service
    ports:
      - "9000:9000"
    depends_on:
      - postgres-food
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-food:5432/userdb
      SPRING_DATASOURCE_USERNAME: userservice_user
      SPRING_DATASOURCE_PASSWORD: userservice_pass
    networks:
      - food-delivery

volumes:
  postgres_data:
  keycloak_data:

networks:
  food-delivery:
